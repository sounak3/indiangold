# fawazahmed0/exchange-api: free, no key, no rate limit, public domain (CC0), updated daily.
id=currency-api
name=Currency-API
type=json-api
description=Free, no sign-up, updated daily. Exchange rates for 300+ currencies, and gold, silver, platinum and palladium.
terms=https://github.com/fawazahmed0/exchange-api
url=https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json
url.fallback=https://latest.currency-api.pages.dev/v1/currencies/usd.min.json
minInterval=PT6H
currency=USD
asOf.path=/date
fx.path=/usd
fx.direction=perUsd
# Metals are listed like currencies: troy ounces per US dollar, so the value is inverted.
metal.gold.path=/usd/xau
metal.gold.invert=true
metal.gold.unit=toz
metal.silver.path=/usd/xag
metal.silver.invert=true
metal.silver.unit=toz
metal.platinum.path=/usd/xpt
metal.platinum.invert=true
metal.platinum.unit=toz
metal.palladium.path=/usd/xpd
metal.palladium.invert=true
metal.palladium.unit=toz
