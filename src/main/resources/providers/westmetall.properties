# westmetall.com publishes the official LME prices on a plain web page; robots.txt allows it and its terms
# don't address the market data. Fetched at most once an hour; the user is shown a disclaimer.
id=westmetall
name=Westmetall (LME prices)
type=web-page
description=Web page: official LME cash prices for copper, aluminium, nickel, zinc, lead and tin, from westmetall.com. Published once a day.
url=https://www.westmetall.com/en/markdaten.php
terms=https://www.westmetall.com/en/impressum.html
minInterval=60
currency=USD
number.decimal=.
number.grouping=,
asOf.select=table:has(th:containsOwn(Official LME-Prices)) th.number
asOf.format=dd. MMMM yyyy
asOf.locale=en
metal.copper.select=table:has(th:containsOwn(Official LME-Prices)) tr:has(a[href$=field=LME_Cu_cash]) td:eq(1)
metal.copper.unit=t
metal.aluminum.select=table:has(th:containsOwn(Official LME-Prices)) tr:has(a[href$=field=LME_Al_cash]) td:eq(1)
metal.aluminum.unit=t
metal.nickel.select=table:has(th:containsOwn(Official LME-Prices)) tr:has(a[href$=field=LME_Ni_cash]) td:eq(1)
metal.nickel.unit=t
metal.zinc.select=table:has(th:containsOwn(Official LME-Prices)) tr:has(a[href$=field=LME_Zn_cash]) td:eq(1)
metal.zinc.unit=t
metal.lead.select=table:has(th:containsOwn(Official LME-Prices)) tr:has(a[href$=field=LME_Pb_cash]) td:eq(1)
metal.lead.unit=t
metal.tin.select=table:has(th:containsOwn(Official LME-Prices)) tr:has(a[href$=field=LME_Sn_cash]) td:eq(1)
metal.tin.unit=t
