# Gold-API.com: free, no key, no rate limit for real-time prices (abuse may get an IP banned).
id=gold-api
name=Gold-API.com
type=json-api
description=Free, no sign-up. Live gold, silver, platinum, palladium and copper prices in US dollars.
terms=https://gold-api.com/terms
# One request per metal, so fetch at most every 5 minutes.
minInterval=5
currency=USD
asOf.path=/updatedAt
error.path=/error
metal.gold.url=https://api.gold-api.com/price/XAU
metal.gold.path=/price
metal.gold.unit=toz
metal.silver.url=https://api.gold-api.com/price/XAG
metal.silver.path=/price
metal.silver.unit=toz
metal.platinum.url=https://api.gold-api.com/price/XPT
metal.platinum.path=/price
metal.platinum.unit=toz
metal.palladium.url=https://api.gold-api.com/price/XPD
metal.palladium.path=/price
metal.palladium.unit=toz
# HG is COMEX copper, quoted in US dollars per pound.
metal.copper.url=https://api.gold-api.com/price/HG
metal.copper.path=/price
metal.copper.unit=lb
