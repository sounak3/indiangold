# Metals.Dev: needs a free key (100 requests a month, or 25 for accounts that sign in with access codes;
# one free account per person); paid plans allow more. The app uses the plan's real total once known.
id=metals-dev
name=Metals.Dev
type=json-api
description=Free key: 100 requests a month (25 for accounts that sign in with an access code), no card needed. All 9 metals and 170 currencies, updated every minute.
signup=https://metals.dev/login
signup.hint=On the Metals.Dev login page, use "Log In / Sign Up" rather than "Get Access Code": accounts that sign in with access codes get 25 requests a month instead of 100. Only one free account per person is allowed.
terms=https://metals.dev/policy/terms
apikey=required
url=https://api.metals.dev/v1/latest?api_key={apikey}&currency=USD
quota.monthly=100
schedule=10:30,16:30
minInterval=1
currency=USD
asOf.path=/timestamps/metal
error.path=/error_message
error.code.path=/error_code
error.kind.1101=API_KEY
error.kind.1201=API_KEY
error.kind.1202=API_KEY
error.kind.1203=QUOTA
error.kind.2101=CONFIGURATION
error.kind.2102=CONFIGURATION
error.kind.2103=CONFIGURATION
# "currencies" holds the US dollar value of one unit of each currency.
fx.path=/currencies
fx.direction=usdPerUnit
# Precious metals are per troy ounce and industrial metals per metric tonne (the API's defaults).
metal.gold.path=/metals/gold
metal.gold.unit=toz
metal.silver.path=/metals/silver
metal.silver.unit=toz
metal.platinum.path=/metals/platinum
metal.platinum.unit=toz
metal.palladium.path=/metals/palladium
metal.palladium.unit=toz
metal.copper.path=/metals/copper
metal.copper.unit=t
metal.aluminum.path=/metals/aluminum
metal.aluminum.unit=t
metal.nickel.path=/metals/nickel
metal.nickel.unit=t
metal.zinc.path=/metals/zinc
metal.zinc.unit=t
metal.lead.path=/metals/lead
metal.lead.unit=t
usage.url=https://api.metals.dev/usage?api_key={apikey}
usage.plan.path=/plan
usage.total.path=/total
usage.used.path=/used
