# Currency codes saved by older versions -> the code to use now.
# Legacy codes replaced by a redenomination or the euro:
BYR=BYN
GHC=GHS
HRK=EUR
EEK=EUR
LVL=EUR
LTL=EUR
SKK=EUR
TRL=TRY
VEF=VES
ZWD=ZWG
ANG=XCG
# El Salvador uses the US dollar as legal tender:
SVC=USD
# Local names that are not ISO 4217 codes, mapped to the currency in use:
GGP=GBP
JEP=GBP
IMP=GBP
TVD=AUD
# Bulgaria adopted the euro on 1 January 2026:
BGN=EUR
